name: Check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      vm:
        description: "Also run the VM test (slow; needs about 6 GB of memory)"
        type: boolean
        default: false

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every node evaluates, the code is clean, broken definitions are rejected
  # and the cluster commands pass ShellCheck. No VMs, nothing big to build.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --no-build
      - name: Build every check except the VM test
        shell: bash # -o pipefail: a failed eval fails the step
        run: |
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
            jq -r '.[] | select(. != "vm") | ".#checks.x86_64-linux." + .' |
            xargs nix build --no-link -L

  # The cluster in VMs; run it by hand before deploying risky changes.
  vm:
    if: github.event_name == 'workflow_dispatch' && inputs.vm
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # also gives the runner access to KVM
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix build --no-link -L .#checks.x86_64-linux.vm
