apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: porkbun-api-secret-reader
  namespace: cert-manager
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - porkbun-api-secret
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: porkbun-webhook-api-secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: porkbun-api-secret-reader
subjects:
  - kind: ServiceAccount
    name: porkbun-webhook
    namespace: cert-manager
