---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: speedtest-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speedtest-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speedtest-exporter
    spec:
      containers:
        - name: speedtest-exporter
          image: ghcr.io/miguelndecarvalho/speedtest-exporter:v3.5.4
          ports:
            - name: metrics
              containerPort: 9798
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: speedtest-exporter
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9798
      targetPort: metrics
  selector:
    app.kubernetes.io/name: speedtest-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-controller
  namespace: monitoring
  labels:
    app.kubernetes.io/name: speedtest-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speedtest-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speedtest-controller
    spec:
      containers:
        - name: speedtest-controller
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          env:
            - name: UPSTREAM_METRICS_URL
              value: http://speedtest-exporter.monitoring.svc:9798/metrics
            - name: SCHEDULE_INTERVAL_SECONDS
              value: "1800"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "180"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: speedtest-controller
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-controller
  namespace: monitoring
  labels:
    app.kubernetes.io/name: speedtest-controller
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: speedtest-controller
