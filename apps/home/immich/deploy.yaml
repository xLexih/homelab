apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-immich
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  numberOfReplicas: "2"
  dataLocality: "disabled"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-immich
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-immich
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgresql
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgresql
    spec:
      containers:
        - name: postgresql
          image: ghcr.io/immich-app/postgres:16-vectorchord0.5.3
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "scram-sha-256"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - name: tcp-pg
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-db
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgresql
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: immich-postgresql
  ports:
    - name: tcp-pg
      port: 5432
      targetPort: tcp-pg
      protocol: TCP
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
spec:
  ingressClassName: apisix
  http:
    - name: http
      match:
        hosts:
          - gallery.flowernode.com
        paths:
          - "/*"
      backends:
        - serviceName: immich-server
          servicePort: 2283
      websocket: true
      plugins:
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - 'return function(conf, ctx) if ngx.var.uri ~= ''/api/assets'' then return end; if ngx.req.get_method() ~= ''POST'' then return end; ngx.req.read_body(); local body = ngx.req.get_body_data(); if not body then local f = ngx.req.get_body_file(); if f then local fh = io.open(f, ''rb''); if fh then body = fh:read(4096); fh:close() end end end; if body and body:lower():find(''filename="[^"]-%.svg"'') then ngx.status = 200; ngx.header[''Content-Type''] = ''application/json''; ngx.say(''{"id": "Cant_Upload_SVG_Files.svg", "status":"duplicate", "error": "unable to upload svg files"}''); return ngx.exit(415) end end'
