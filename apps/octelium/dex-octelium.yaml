kind: Service
metadata:
  name: idp
spec:
  mode: HTTP
  config:
    upstream:
      url: http://octelium-dex.octelium.svc:5556
    http:
      header:
        host:
          preserve: true
  isPublic: true
  isAnonymous: true
---
kind: IdentityProvider
metadata:
  name: dex
spec:
  displayName: Main Login
  oidc:
    clientID: octelium
    clientSecret:
      fromSecret: dex-client
    issuerURL: https://idp.flowernode.com/dex
---
kind: User
metadata:
  name: admin
spec:
  type: HUMAN
  email: admin@flowernode.com
  authentication:
    identities:
      - identityProvider: dex
        identifier: admin@flowernode.com
  authorization:
    policies:
      - allow-all
