apiVersion: v1
kind: Namespace
metadata:
  name: octelium-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: octelium-postgres
  namespace: octelium-bootstrap
spec:
  selector:
    app.kubernetes.io/name: octelium-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: octelium-postgres
  namespace: octelium-bootstrap
spec:
  serviceName: octelium-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octelium-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octelium-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: octelium
            - name: POSTGRES_USER
              value: octelium
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: octelium-pg
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: octelium-redis
  namespace: octelium-bootstrap
spec:
  selector:
    app.kubernetes.io/name: octelium-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: octelium-redis
  namespace: octelium-bootstrap
spec:
  serviceName: octelium-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octelium-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octelium-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: octelium-redis
                  key: password
          command:
            - sh
            - -ec
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: octelium-rscserver-hostnetwork
spec:
  endpointSelector:
    matchLabels:
      io.kubernetes.pod.namespace: octelium
      app: octelium
      octelium.com/component: rscserver
      octelium.com/component-type: cluster
  ingress:
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
